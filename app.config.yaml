application:
  hooks:
    pre-app-deploy: ./scripts/hooks/pre-app-deploy.js
  runtimeManifest:
    packages:
      starter-kit:
        license: Apache-2.0
        actions:
          info:
            function: actions/starter-kit-info/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: true
              final: true
      product-commerce:
        license: MIT
        actions:
          $include: ./actions/product/commerce/actions.config.yaml
      customer-commerce:
        license: MIT
        actions:
          $include: ./actions/customer/commerce/actions.config.yaml
      order-commerce:
        license: MIT
        actions:
          $include: ./actions/order/commerce/actions.config.yaml
      subscriber-commerce:
        license: MIT
        actions:
          $include: ./actions/subscriber/commerce/actions.config.yaml
  events:
    registrations:
      Customer Commerce Sync:
        description: Customer Commerce Sync
        events_of_interest:
          - provider_metadata: dx_commerce_events
            event_codes:
              - com.adobe.commerce.observer.dotdigital.customer_save_commit_after
        runtime_action: customer-commerce/consumer
      Order Commerce Sync:
        description: Order Commerce Sync
        events_of_interest:
          - provider_metadata: dx_commerce_events
            event_codes:
              - com.adobe.commerce.observer.dotdigital.sales_order_save_commit_after
        runtime_action: order-commerce/consumer
      Product Commerce Sync:
        description: Product Commerce Sync
        events_of_interest:
          - provider_metadata: dx_commerce_events
            event_codes:
              - com.adobe.commerce.observer.dotdigital.catalog_product_save_commit_after
        runtime_action: product-commerce/consumer
      Subscriber Commerce Sync:
        description: Subscriber Commerce Sync
        events_of_interest:
          - provider_metadata: dx_commerce_events
            event_codes:
              - com.adobe.commerce.observer.dotdigital.newsletter_subscriber_save_after
        runtime_action: subscriber-commerce/consumer
productDependencies:
  - code: COMMC
    minVersion: 2.4.4
    maxVersion: 2.4.8
