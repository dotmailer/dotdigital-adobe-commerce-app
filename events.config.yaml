      - event_code: com.adobe.commerce.observer.dotdigital.newsletter_subscriber_save_after
        label: Subscriber Saved
        description: Triggers when a newsletter subscriber is saved in Commerce
        sample_event_template: '{
                                  "value": {
                                    "subscriber_email": "example@example.com"
                                  }
                                }'
    subscription:
      - event:
          name: observer.dotdigital.catalog_product_save_commit_after
          parent: observer.catalog_product_save_commit_after
          fields:
            - name: 'id'
            - name: 'entity_id'
            - name: 'name'
            - name: 'sku'
            - name: 'stock_data.qty'
            - name: 'price'
            - name: 'status'
            - name: 'type_id'
            - name: 'url_key'
            - name: 'image'
            - name: 'created_at'
            - name: 'parent_id'
            - name: 'store_ids'
      - event:
          name: observer.dotdigital.customer_save_commit_after
          parent: observer.customer_save_commit_after
          fields:
            - name: 'id'
            - name: 'email'
      - event:
          name: observer.dotdigital.sales_order_save_commit_after
          parent: observer.sales_order_save_commit_after
          fields:
            - name: 'entity_id'
            - name: 'grand_total'
            - name: 'order_currency_code'
            - name: 'created_at'
            - name: 'subtotal'
            - name: 'items'
            - name: 'customer_email'
            - name: 'increment_id'
            - name: 'quote_id'
            - name: 'status'
            - name: 'addresses'
            - name: 'store_name'
            - name: 'discount_amount'
            - name: 'payment'
            - name: 'shipping_description'
            - name: 'shipping_amount'
            - name: 'coupon_code'
      - event:
          name: observer.dotdigital.newsletter_subscriber_save_after
          parent: observer.newsletter_subscriber_save_after
          fields:
            - name: '*'
