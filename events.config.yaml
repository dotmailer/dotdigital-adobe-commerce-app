# This event specification is read by the `configure-events` script
event_providers:
  - label: Commerce events provider
    provider_metadata: dx_commerce_events
    description: Event provider for Adobe Commerce
    docs_url: https://developer.adobe.com/commerce/extensibility/events/
    events_metadata:
      # Mandatory fields of event metadata: event_code, label
      - event_code: com.adobe.commerce.observer.dotdigital.catalog_product_save_commit_after
        label: Product Saved
        description: Triggers when a product is saved in Commerce
        sample_event_template: '{
                                  "value": {
                                    "created_at": "2024-12-03 16:30:57",
                                    "entity_id": "1",
                                    "image": "/example/path/to/image.jpg",
                                    "name": "Example Product Name",
                                    "parent_id": 0,
                                    "price": "100.000000",
                                    "sku": "example-sku",
                                    "status": "1",
                                    "stock_data": {
                                      "qty": "100"
                                    },
                                    "store_ids": [
                                      "1"
                                    ],
                                    "type_id": "simple",
                                    "url_key": "example-product-url"
                                  }
                                }'
      - event_code: com.adobe.commerce.observer.dotdigital.customer_save_commit_after
        label: Customer Saved
        description: Triggers when a customer is saved in Commerce
        sample_event_template: '{
                                  "value": {
                                    "id": 1,
                                    "email": "example@example.com"
                                  }
                                }'
